name: 功能建议 / Feature request
description: 提出新功能或现有功能的改进建议 / Suggest a feature or improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索是否已有类似建议，每个 Issue 尽量只描述一个需求。可使用中文或英文填写。
        Please search existing suggestions and describe one request per issue. Chinese and English are both welcome.

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景与遇到的问题 / Use case and problem
      description: 你在什么情况下需要这个功能？当前操作有什么不便？ / When would you use this feature, and what is difficult with the current workflow?
      placeholder: "在编曲、练习或导入曲谱时…… / When arranging, practicing, or importing a score ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望增加或改进的功能 / Proposed feature or improvement
      description: 描述期望的操作和结果即可，不需要提供技术实现。 / Describe the desired workflow and outcome; implementation details are not required.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方式（可选） / Current workaround, optional
      description: 如果已经尝试过其他做法，可以说明它们的限制。 / If you have tried another approach, describe its limitations.

  - type: textarea
    id: examples
    attributes:
      label: 示例与补充说明（可选） / Examples and additional context, optional
      description: 可附参考截图、操作示意或相关 Issue 链接。 / Add reference screenshots, workflow examples, or related issue links.
