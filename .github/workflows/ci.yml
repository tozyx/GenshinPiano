name: CI

on:
  push:
    branches: [v3.0, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GenshinPiano.sln -p:NuGetAudit=false

      - name: Build
        run: dotnet build GenshinPiano.sln -c Release --no-restore -p:NuGetAudit=false

      - name: Test
        run: dotnet test tests/GenshinPiano.Core.Tests/GenshinPiano.Core.Tests.csproj -c Release --no-build --no-restore -p:NuGetAudit=false
