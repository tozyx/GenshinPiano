name: Build from source

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (major.minor.patch, optional prerelease suffix)'
        required: true
        default: '3.1.1'
        type: string
      include_ocr_resources:
        description: 'Include OCR models and native dependencies in both packages'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.package_type }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package_type: [Framework, SelfContained]
    steps:
      - name: Check out selected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test tests/GenshinPiano.Core.Tests/GenshinPiano.Core.Tests.csproj -c Release -p:NuGetAudit=false

      - name: Build unsigned package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          INCLUDE_OCR: ${{ inputs.include_ocr_resources }}
        run: |
          $options = @{
            Version = $env:PACKAGE_VERSION
            PackageType = $env:PACKAGE_TYPE
            OutputDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/source-build'
            IncludeOcrResources = $env:INCLUDE_OCR -eq 'true'
          }
          ./tools/Build-UnsignedAppPackage.ps1 @options

      - name: Upload ZIP, checksum, and build information
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GenshinPiano-${{ matrix.package_type }}-${{ github.sha }}
          path: |
            artifacts/source-build/*.zip
            artifacts/source-build/*.zip.sha256
            artifacts/source-build/*.zip.build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
